<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ProGlove Raw Input Tester</title>

<style>
body {
    margin:0;
    background:#020617;
    color:#e2e8f0;
    font:16px monospace;
}

.w {
    max-width:950px;
    margin:auto;
    padding:22px;
}

h1 {
    font-size:28px;
}

input,.box,button {
    box-sizing:border-box;
    width:100%;
    border-radius:14px;
}

.scan {
    padding:16px;
    background:#0f172a;
    color:#fff;
    border:2px solid #06b6d4;
    outline:0;
    font-size:18px;
}

.box {
    margin-top:16px;
    padding:18px;
    background:#0f172a;
    min-height:55px;
    word-break:break-all;
}

.t {
    color:#22d3ee;
    font-weight:bold;
    margin-bottom:9px;
}

.events {
    white-space:pre-wrap;
    font-size:13px;
}

.amber {
    color:#fbbf24;
}

button {
    margin-top:16px;
    width:auto;
    padding:12px 22px;
    border:0;
    background:#dc2626;
    color:white;
    font-weight:bold;
}

.note {
    color:#94a3b8;
    font-size:12px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="w">

<h1>ProGlove Raw Input Tester</h1>

<p>
Napauta SCAN INPUT -kenttää ja lue viivakoodi ProGlovella.
</p>

<input
    id="scan"
    class="scan"
    placeholder="SCAN INPUT - napauta tähän"
    autocomplete="off"
>

<div class="box">
    <div class="t">Raw input:</div>
    <div id="raw">-</div>
</div>

<div class="box">
    <div class="t">Readable:</div>
    <div id="readable">-</div>
</div>

<div class="box">
    <div class="t">HEX:</div>
    <div id="hex">-</div>
</div>

<div class="box">
    <div class="t">Character codes:</div>
    <div id="codes">-</div>
</div>

<div class="box">
    <div class="t amber">Keyboard events:</div>
    <div id="events" class="events">-</div>
</div>

<button id="clear">CLEAR</button>

<div class="note">
GS / FNC1 näkyy muodossa &lt;GS 0x1D&gt;, jos selain todella vastaanottaa merkin 0x1D.
</div>

</div>

<script>

const scan = document.getElementById("scan");
const raw = document.getElementById("raw");
const readable = document.getElementById("readable");
const hex = document.getElementById("hex");
const codes = document.getElementById("codes");
const events = document.getElementById("events");

let logs = [];

function visibleChar(code) {

    if (code === 29) return "<GS 0x1D>";
    if (code === 28) return "<FS 0x1C>";
    if (code === 30) return "<RS 0x1E>";
    if (code === 31) return "<US 0x1F>";
    if (code === 13) return "<CR>";
    if (code === 10) return "<LF>";
    if (code === 9) return "<TAB>";

    if (code < 32) {
        return "<CTRL 0x" +
            code.toString(16).toUpperCase().padStart(2,"0") +
            ">";
    }

    return String.fromCodePoint(code);
}

function analyze() {

    const value = scan.value;

    const arr = Array.from(value);

    raw.textContent =
        value.length ? value : "-";

    readable.textContent =
        value.length
        ? arr.map(c => visibleChar(c.codePointAt(0))).join("")
        : "-";

    hex.textContent =
        value.length
        ? arr.map(c =>
            c.codePointAt(0)
             .toString(16)
             .toUpperCase()
             .padStart(2,"0")
          ).join(" ")
        : "-";

    codes.textContent =
        value.length
        ? arr.map(c => {
            const n = c.codePointAt(0);

            return visibleChar(n) +
                   " = DEC " + n +
                   " / HEX 0x" +
                   n.toString(16)
                    .toUpperCase()
                    .padStart(2,"0");
          }).join("\n")
        : "-";
}

scan.addEventListener("input", function(e) {

    logs.push(
        "INPUT | value=" +
        JSON.stringify(scan.value) +
        " | inputType=" +
        e.inputType
    );

    logs = logs.slice(-100);

    events.textContent = logs.join("\n");

    analyze();
});

scan.addEventListener("keydown", function(e) {

    logs.push(
        "KEYDOWN | key=" +
        JSON.stringify(e.key) +
        " | code=" +
        e.code +
        " | keyCode=" +
        e.keyCode +
        " | which=" +
        e.which
    );

    logs = logs.slice(-100);

    events.textContent = logs.join("\n");
});

scan.addEventListener("keyup", function(e) {

    logs.push(
        "KEYUP | key=" +
        JSON.stringify(e.key) +
        " | code=" +
        e.code +
        " | keyCode=" +
        e.keyCode
    );

    logs = logs.slice(-100);

    events.textContent = logs.join("\n");
});

document.getElementById("clear").onclick = function() {

    scan.value = "";
    logs = [];

    raw.textContent = "-";
    readable.textContent = "-";
    hex.textContent = "-";
    codes.textContent = "-";
    events.textContent = "-";

    scan.focus();
};

scan.focus();

</script>

</body>
</html>

<!doctype html>
<html lang="fi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ProGlove Raw Input Tester</title>

<style>

body {
    margin:0;
    background:#020617;
    color:#e2e8f0;
    font:16px monospace;
}

.w {
    max-width:950px;
    margin:auto;
    padding:22px;
}

h1 {
    font-size:28px;
}

input,.box,button {
    box-sizing:border-box;
    width:100%;
    border-radius:14px;
}

.scan {
    padding:16px;
    background:#0f172a;
    color:#fff;
    border:2px solid #06b6d4;
    outline:0;
    font-size:18px;
}

.box {
    margin-top:16px;
    padding:18px;
    background:#0f172a;
    min-height:55px;
    word-break:break-all;
}

.t {
    color:#22d3ee;
    font-weight:bold;
    margin-bottom:9px;
}

.events {
    white-space:pre-wrap;
    font-size:13px;
}

.amber {
    color:#fbbf24;
}

.gs-output {
    white-space:pre-wrap;
    line-height:1.6;
}

.gs-found {
    color:#4ade80;
    font-weight:bold;
}

.gs-not-found {
    color:#f87171;
    font-weight:bold;
}

button {
    margin-top:16px;
    width:auto;
    padding:12px 22px;
    border:0;
    background:#dc2626;
    color:white;
    font-weight:bold;
}

.note {
    color:#94a3b8;
    font-size:12px;
    margin-top:18px;
}

</style>
</head>

<body>

<div class="w">

<h1>ProGlove Raw Input Tester</h1>

<p>
Napauta SCAN INPUT -kenttää ja lue viivakoodi ProGlovella.
</p>

<input
    id="scan"
    class="scan"
    placeholder="SCAN INPUT - napauta tähän"
    autocomplete="off"
>

<div class="box">
    <div class="t">Raw input:</div>
    <div id="raw">-</div>
</div>

<div class="box">
    <div class="t">Readable:</div>
    <div id="readable">-</div>
</div>

<div class="box">
    <div class="t">HEX:</div>
    <div id="hex">-</div>
</div>

<div class="box">
    <div class="t">Character codes:</div>
    <div id="codes" class="events">-</div>
</div>

<div class="box">
    <div class="t amber">GS / FNC1 Detection:</div>
    <div id="gs" class="gs-output">-</div>
</div>

<div class="box">
    <div class="t amber">Keyboard events:</div>
    <div id="events" class="events">-</div>
</div>

<button id="clear">CLEAR</button>

<div class="note">
GS / FNC1 näkyy muodossa &lt;GS 0x1D&gt;, jos selain todella vastaanottaa ASCII 29 / HEX 0x1D -merkin.
</div>

</div>

<script>

const scan = document.getElementById("scan");
const raw = document.getElementById("raw");
const readable = document.getElementById("readable");
const hex = document.getElementById("hex");
const codes = document.getElementById("codes");
const gs = document.getElementById("gs");
const events = document.getElementById("events");

let logs = [];

function visibleChar(code) {

    if (code === 29) return "<GS 0x1D>";
    if (code === 28) return "<FS 0x1C>";
    if (code === 30) return "<RS 0x1E>";
    if (code === 31) return "<US 0x1F>";
    if (code === 13) return "<CR>";
    if (code === 10) return "<LF>";
    if (code === 9) return "<TAB>";

    if (code < 32) {
        return "<CTRL 0x" +
            code.toString(16).toUpperCase().padStart(2,"0") +
            ">";
    }

    return String.fromCodePoint(code);
}


function analyze() {

    const value = scan.value;
    const arr = Array.from(value);

    /*
     * RAW INPUT
     */

    raw.textContent =
        value.length ? value : "-";


    /*
     * READABLE
     */

    readable.textContent =
        value.length
        ? arr.map(c =>
            visibleChar(c.codePointAt(0))
          ).join("")
        : "-";


    /*
     * HEX
     */

    hex.textContent =
        value.length
        ? arr.map(c =>
            c.codePointAt(0)
             .toString(16)
             .toUpperCase()
             .padStart(2,"0")
          ).join(" ")
        : "-";


    /*
     * CHARACTER CODES
     */

    codes.textContent =
        value.length
        ? arr.map(c => {

            const n = c.codePointAt(0);

            return visibleChar(n) +
                   " = DEC " + n +
                   " / HEX 0x" +
                   n.toString(16)
                    .toUpperCase()
                    .padStart(2,"0");

          }).join("\n")
        : "-";


    /*
     * GS / FNC1 DETECTION
     */

    const gsPositions = [];

    arr.forEach((c, index) => {

        if (c.codePointAt(0) === 29) {
            gsPositions.push(index);
        }

    });


    if (gsPositions.length > 0) {

        let result =
            "GS FOUND: YES\n" +
            "Count: " + gsPositions.length + "\n" +
            "Position(s): " + gsPositions.join(", ");


        /*
         * Jos vain yksi GS löytyy,
         * näytetään myös mitä oli
         * ennen ja jälkeen GS-merkin.
         */

        if (gsPositions.length === 1) {

            const pos = gsPositions[0];

            result +=
                "\n\nBefore GS:\n" +
                arr.slice(0, pos).join("") +

                "\n\nAfter GS:\n" +
                arr.slice(pos + 1).join("");
        }


        /*
         * Näytetään lisäksi koko
         * data GS näkyväksi muutettuna.
         */

        result +=
            "\n\nDetected data:\n" +
            arr.map(c =>
                visibleChar(c.codePointAt(0))
            ).join("");


        gs.textContent = result;

        gs.classList.remove("gs-not-found");
        gs.classList.add("gs-found");

    } else {

        gs.textContent =
            "GS FOUND: NO\n" +
            "No ASCII 29 / HEX 0x1D character detected.";

        gs.classList.remove("gs-found");
        gs.classList.add("gs-not-found");
    }
}


/*
 * INPUT EVENT
 */

scan.addEventListener("input", function(e) {

    logs.push(
        "INPUT | value=" +
        JSON.stringify(scan.value) +
        " | inputType=" +
        e.inputType
    );

    logs = logs.slice(-100);

    events.textContent =
        logs.join("\n");

    analyze();
});


/*
 * KEYDOWN EVENT
 */

scan.addEventListener("keydown", function(e) {

    logs.push(
        "KEYDOWN | key=" +
        JSON.stringify(e.key) +
        " | code=" +
        e.code +
        " | keyCode=" +
        e.keyCode +
        " | which=" +
        e.which
    );

    logs = logs.slice(-100);

    events.textContent =
        logs.join("\n");
});


/*
 * KEYUP EVENT
 */

scan.addEventListener("keyup", function(e) {

    logs.push(
        "KEYUP | key=" +
        JSON.stringify(e.key) +
        " | code=" +
        e.code +
        " | keyCode=" +
        e.keyCode
    );

    logs = logs.slice(-100);

    events.textContent =
        logs.join("\n");
});


/*
 * CLEAR
 */

document.getElementById("clear").onclick = function() {

    scan.value = "";

    logs = [];

    raw.textContent = "-";
    readable.textContent = "-";
    hex.textContent = "-";
    codes.textContent = "-";
    gs.textContent = "-";
    events.textContent = "-";

    gs.classList.remove(
        "gs-found",
        "gs-not-found"
    );

    scan.focus();
};


/*
 * Focus automatically when page opens
 */

scan.focus();

</script>

</body>
</html>
